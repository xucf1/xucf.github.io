# 工作流名字（会显示在仓库的 Actions 页面里）
name: Deploy Jekyll site to GitHub Pages

# 触发条件
on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:     # 也允许手动点按钮运行

# 给这次运行的令牌授权：部署 Pages 需要这些权限
permissions:
  contents: read         # 读代码
  pages: write           # 写/部署 GitHub Pages
  id-token: write        # 部署时做身份校验

# 同一时间只允许一个部署在跑，避免互相覆盖
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ===== 第一个 job：构建网站 =====
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true          # 按 Gemfile 自动装依赖并缓存

      # 配置 Pages；enablement: true 会自动帮你开启 GitHub Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # 把构建好的 _site 打包成 Pages 专用产物
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  # ===== 第二个 job：把产物部署上线 =====
  deploy:
    needs: build                       # 等 build 成功后才跑
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}   # 部署后的在线网址
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
